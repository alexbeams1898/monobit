name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  # -----------------------------------------------------------------------
  # 1. FORMAT CHECK  (clang-format)
  #    Fails if any file differs from what clang-format would produce.
  #    Same as running Prettier --check in a JS project.
  # -----------------------------------------------------------------------
  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: |
          # Pin to clang-format 18.1.x from the LLVM apt repo. Ubuntu's
          # default `clang-format` package is 1:18.0-59~exp2 which is a
          # pre-release with subtly different formatting heuristics from
          # the released 18.1.x that MSYS2 mingw64 ships locally — files
          # that pass `clang-format -i` on Windows fail `--dry-run` on CI.
          # Pinning aligns the two.
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-18 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-18 100
          clang-format --version

      - name: Check formatting
        run: |
          # Skip archived subtrees -- they're imported from mono and held to that
          # repo's formatting rules. Treat as read-only reference; not extended.
          find engines games \
              \( -path engines/arduboy-legacy -o -path games/rpg-arduboy \) -prune \
            -o \( -name '*.cpp' -o -name '*.h' \) -print | \
          xargs clang-format --dry-run --Werror

  # -----------------------------------------------------------------------
  # 2. COMMENT DENSITY  — per-file ratio + project budget.
  #    Initial threshold 30%; ratchet down as files get trimmed.
  # -----------------------------------------------------------------------
  comments:
    name: Comment density
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run comment-density linter
        run: python3 games/selva-oscura/scripts/check_comment_density.py

  # -----------------------------------------------------------------------
  # 2b. BANDAID KEYWORDS  — grep source comments for TODO/FIXME/HACK/
  #     bandaid/workaround/etc. Per CLAUDE.md "no deferred work in source"
  #     doctrine: deferred work goes to GitHub issues, not source comments.
  # -----------------------------------------------------------------------
  bandaid_keywords:
    name: Bandaid keyword scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run bandaid-keyword linter
        run: python3 games/selva-oscura/scripts/check_bandaid_keywords.py

  # -----------------------------------------------------------------------
  # 3. BUILD + LINT  (clang-tidy runs during the build via CMake)
  #    Also compiles everything — catches compiler errors on every PR.
  # -----------------------------------------------------------------------
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            clang clang-tidy \
            libsdl2-dev libgl1-mesa-dev

      # Cache the full build directory — preserves SDL2's configure results,
      # compiled dep artifacts, and our own object files.
      # Key covers all CMake and source files; any change busts only the
      # affected objects (restore-keys falls back to nearest prior cache).
      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-monobit-build-${{ hashFiles('cmake/**', 'CMakeLists.txt', 'engines/**', 'games/**', 'tests/**') }}
          restore-keys: |
            ${{ runner.os }}-monobit-build-

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # -----------------------------------------------------------------------
  # 3. LINT  (clang-tidy)
  #    Runs against compile_commands.json + the fetched _deps headers,
  #    both produced at CMake CONFIGURE time. Does not need the build
  #    artifacts -- runs in parallel with the main build/test job.
  #
  #    Scope selection (PR only; push-to-master lints everything):
  #      - directly-changed .cpp files
  #      - for each directly-changed .h/.hpp, every .cpp in the same
  #        "src/" tree that mirrors the header's "include/" tree
  #          e.g. include/render/Texture.h -> src/render/*.cpp
  #          e.g. include/insight/Insight.h -> src/insight/*.cpp
  #    Conservative compared to the old `ninja -t deps` pass (lints
  #    sibling .cpp files even when they don't transitively include the
  #    changed header), but does not require the build to have run --
  #    which is what lets this job sit outside the `build` job.
  # -----------------------------------------------------------------------
  clang-tidy:
    name: Lint (clang-tidy)
    runs-on: ubuntu-latest
    # No `needs: build`. clang-tidy reads compile_commands.json (written
    # at CMake CONFIGURE) and the headers in build/_deps/ (fetched at
    # CONFIGURE). Both are populated by `cmake -S . -B build` alone --
    # no compilation needed. Runs in parallel with the build job.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need history for the PR-base diff

      - name: Install dependencies
        run: |
          # Pin to clang-format/clang-tidy 18.1.x from the LLVM apt repo;
          # matches the local MSYS2 mingw64 toolchain.
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-18 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build clang-18 clang-tidy-18 \
            libsdl2-dev libgl1-mesa-dev
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-18 100

      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-monobit-build-${{ hashFiles('cmake/**', 'CMakeLists.txt', 'engines/**', 'games/**', 'tests/**') }}
          restore-keys: |
            ${{ runner.os }}-monobit-build-

      - name: Configure
        run: |
          # Re-run configure unconditionally so compile_commands.json
          # reflects the current tree even on a cache hit. CMake is
          # incremental + fast (~5s) so this isn't a meaningful cost.
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Find files to lint
        id: lint-files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only --diff-filter=d \
              origin/${{ github.base_ref }}...HEAD -- \
              'engines/' 'games/' \
              ':(exclude)engines/arduboy-legacy/**' \
              ':(exclude)games/rpg-arduboy/**')

            CHANGED_CPPS=$(echo "$CHANGED" | grep -E '\.cpp$' || true)
            CHANGED_HEADERS=$(echo "$CHANGED" | grep -E '\.h(pp)?$' || true)

            # Map each changed header to its mirrored src/ directory and
            # collect every .cpp in that directory.
            # include/render/Texture.h -> src/render/ -> src/render/*.cpp
            HEADER_AFFECTED=""
            for h in $CHANGED_HEADERS; do
              src_dir=$(echo "$h" | sed -E 's|/include/|/src/|; s|/[^/]+\.h(pp)?$||')
              if [ -d "$src_dir" ]; then
                affected=$(find "$src_dir" -maxdepth 1 -name '*.cpp')
                if [ -n "$affected" ]; then
                  HEADER_AFFECTED=$(printf '%s\n%s' "$HEADER_AFFECTED" "$affected")
                fi
              fi
            done

            FILES=$(printf "%s\n%s" "$CHANGED_CPPS" "$HEADER_AFFECTED" | \
              grep -E '\.cpp$' | grep -vE '^(build|_deps)/' | sort -u)
          else
            FILES=$(find engines games \
                \( -path engines/arduboy-legacy -o -path games/rpg-arduboy \) -prune \
              -o -name '*.cpp' -print)
          fi
          if [ -z "$FILES" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No .cpp files to lint."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "$FILES" > /tmp/lint-files.txt
            COUNT=$(echo "$FILES" | wc -l)
            echo "Linting $COUNT file(s):"
            cat /tmp/lint-files.txt
          fi

      - name: Neutralize third-party .clang-tidy configs
        if: steps.lint-files.outputs.skip != 'true'
        # Tracy ships its own .clang-tidy with `AnalyzeTemporaryDtors`,
        # an unknown key in clang-tidy 18+ that fails the run at config
        # parse time. Our HeaderFilterRegex excludes their headers
        # anyway; just remove their config so clang-tidy uses ours
        # everywhere.
        run: |
          find build/_deps -name '.clang-tidy' -delete 2>/dev/null || true

      - name: Lint (clang-tidy)
        if: steps.lint-files.outputs.skip != 'true'
        run: |
          xargs -P $(nproc) \
            clang-tidy -p build \
              --header-filter='(engines/engine|games/[^/]+)/.*\.(h|hpp)$' \
              --warnings-as-errors='*' \
            < /tmp/lint-files.txt

  # -----------------------------------------------------------------------
  # 4. STATIC ANALYSIS  (cppcheck)
  #    Runs against the project compile_commands.json. Restricted to our
  #    source trees; suppresses noise in third-party deps and a small set
  #    of pedantic checks we don't want enforced.
  #
  #    NOTE: continue-on-error while the pre-existing pile is cleaned up.
  #    Flip to required (remove continue-on-error) once master is clean.
  #    Tracking issue: see engines/engine/docs/TECH-DEBT.md.
  # -----------------------------------------------------------------------
  cppcheck:
    name: Static analysis (cppcheck)
    runs-on: ubuntu-latest
    # No `needs: build` -- cppcheck only requires compile_commands.json,
    # which CMake writes at CONFIGURE time, not BUILD time. Running this
    # in parallel with `build` (which compiles + clang-tidies a much
    # larger TU set) shortens overall CI wall time.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            cppcheck \
            libsdl2-dev libgl1-mesa-dev

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-monobit-build-${{ hashFiles('cmake/**', 'CMakeLists.txt', 'engines/**', 'games/**', 'tests/**') }}
          restore-keys: |
            ${{ runner.os }}-monobit-build-

      - name: Configure (if cache miss)
        run: |
          if [ ! -f build/compile_commands.json ]; then
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          fi

      - name: cppcheck
        run: |
          cppcheck --project=build/compile_commands.json \
            --enable=all \
            --suppress=missingInclude \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --suppress=useStlAlgorithm \
            --suppress=unmatchedSuppression \
            --suppress=normalCheckLevelMaxBranches \
            --suppress=checkersReport \
            --suppressions-list=cppcheck-suppressions.txt \
            --file-filter='engines/engine/*' \
            --file-filter='games/prison-escape-game/*' \
            --file-filter='games/selva-oscura/*' \
            --error-exitcode=1 \
            --quiet

  # -----------------------------------------------------------------------
  # 4. COMPLEXITY  (lizard)
  #    Fails on functions over CCN 15, length 250, or 8 parameters.
  #    Same thresholds as the local pre-push pipeline.
  #
  #    Scope: engines/engine/ + games/selva-oscura/src/ — both active.
  #    games/prison-escape-game/ is intentionally excluded; it has ~50
  #    pre-existing offenders (CombatSystem::update CCN 193, etc.) that
  #    need their own focused cleanup branch. Add it back here once the
  #    legacy pile is cleaned up.
  # -----------------------------------------------------------------------
  lizard:
    name: Complexity check (lizard)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lizard
        run: pip install lizard

      - name: Run lizard
        run: |
          lizard \
            engines/engine/ \
            games/selva-oscura/src/ \
            -C 15 -L 250 -a 8 -w

  # -----------------------------------------------------------------------
  # 5. SANITIZED TEST RUN  (ASan + UBSan)
  #    Builds a Debug build with -fsanitize=address,undefined and runs the
  #    test suite. Catches use-after-free, double-free, buffer overflow,
  #    signed overflow, null deref, misaligned access, etc. — at the line
  #    of the bug, with a stack trace.
  #
  #    Uses a separate build directory (no cache key collision with the
  #    non-sanitized build job).
  # -----------------------------------------------------------------------
  sanitized-tests:
    name: Tests under sanitizers (ASan + UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            clang \
            libsdl2-dev libgl1-mesa-dev

      - name: Cache sanitized build directory
        uses: actions/cache@v4
        with:
          path: build-san
          key: ${{ runner.os }}-monobit-build-san-${{ hashFiles('cmake/**', 'CMakeLists.txt', 'engines/**', 'games/**', 'tests/**') }}
          restore-keys: |
            ${{ runner.os }}-monobit-build-san-

      - name: Configure (sanitized)
        run: |
          cmake -S . -B build-san -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_SANITIZERS=ON

      - name: Build (sanitized)
        run: cmake --build build-san

      - name: Test (sanitized)
        env:
          # Halt at the first error and print a full stack trace; ASan
          # default would abort silently in some configs.
          ASAN_OPTIONS: halt_on_error=1:abort_on_error=1:print_stacktrace=1
          UBSAN_OPTIONS: halt_on_error=1:abort_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-san --output-on-failure
