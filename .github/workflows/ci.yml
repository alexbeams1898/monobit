name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  # Whole-tree analysis is half an hour of work, so it runs nightly rather
  # than in front of a merge. workflow_dispatch makes it available on demand
  # when a branch wants the full picture before landing.
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  # =======================================================================
  # STAGE 1 -- STANDARDS
  #
  # Every gate that needs no toolchain and no build: seconds of work, so it
  # runs first and everything expensive waits on it. One job rather than
  # four, because four runners booting to run four scripts costs more in
  # startup than the scripts cost to run.
  # =======================================================================
  standards:
    name: Code standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          # clang-format pinned to 18.1.x from the LLVM apt repo. Ubuntu's
          # default package is 1:18.0-59~exp2, a pre-release whose formatting
          # heuristics differ subtly from the released 18.1.x that MSYS2
          # mingw64 ships locally -- files that pass `clang-format -i` on
          # Windows fail `--dry-run` here. Pinning aligns the two.
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-18 main" | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y clang-format-18
          sudo update-alternatives --install /usr/bin/clang-format clang-format /usr/bin/clang-format-18 100
          # lizard pinned for the same reason: unpinned, a new release changes
          # what counts as a parameter or a branch and the tree starts failing
          # with no code having changed. The version is the contract.
          pip install lizard==1.24.0
          clang-format --version

      - name: Formatting
        run: |
          # Archived subtrees keep the formatting rules of the repo they came
          # from. Read-only reference; not extended, not reformatted.
          find engines games \
              \( -path engines/arduboy-legacy -o -path games/rpg-arduboy \) -prune \
            -o \( -name '*.cpp' -o -name '*.h' \) -print | \
          xargs clang-format --dry-run --Werror

      - name: Comment density
        # Per-file ratio plus a project budget. Threshold starts at 30% and
        # ratchets down as files are trimmed.
        run: python3 scripts/check_comment_density.py

      - name: Deferred-work markers
        # TODO/FIXME/HACK and friends in source. Deferred work belongs in the
        # issue tracker, where it can be found, not in a comment nobody greps.
        run: python3 scripts/check_bandaid_keywords.py

      - name: Comment content
        # Density measures how much a comment says; this measures what it is
        # allowed to say -- no tool names, no version labels, no citations to
        # documents that are not in this repo.
        run: python3 scripts/check_comment_content.py

      - name: Dialog register
        run: python3 games/selva-oscura/scripts/check_dialog_register.py

      - name: Game-specific gates
        # These resolve config/ and assets/ relative to the game directory, so
        # they run from inside it. Each catches drift a compiler cannot see: a
        # word that grew a second spelling, a config key nothing reads, a map
        # entity with no builder.
        run: |
          cd games/point-of-entry
          python3 scripts/check_vocab.py
          python3 scripts/check_design.py
          python3 scripts/check_structure.py
          python3 scripts/check_areas.py

      - name: Script tests
        # The tooling that gates every PR has tests; nothing was running them.
        run: |
          python3 scripts/test_changelog.py
          python3 scripts/test_filter_compile_db.py

      - name: Complexity limits
        # prison-escape-game is excluded: it carries a pile of pre-existing
        # offenders that need their own cleanup pass before the gate can hold.
        run: |
          lizard \
            engines/engine/ \
            games/selva-oscura/src/ \
            games/wayworn-hush/src/ \
            -C 15 -L 250 -a 8 -w

  # =======================================================================
  # STAGE 2 -- BUILD, ANALYSIS, TESTS
  #
  # Everything that needs a toolchain. All four run in parallel with each
  # other and all four wait on stage 1, so a stray space in a header costs
  # thirty seconds instead of twenty runner-minutes.
  # =======================================================================
  build:
    name: Build and test
    needs: standards
    runs-on: ubuntu-latest
    steps:
      # Default shallow checkout. Nothing in the build reads history -- no
      # version is derived from git -- and a full clone costs 350MB here,
      # most of it art assets no build step opens.
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            clang clang-tidy \
            libsdl2-dev libgl1-mesa-dev

      # Cache the full build directory — preserves SDL2's configure results,
      # compiled dep artifacts, and our own object files.
      # Key covers all CMake and source files; any change busts only the
      # affected objects (restore-keys falls back to nearest prior cache).
      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-monobit-build-${{ hashFiles('cmake/**', 'CMakeLists.txt', 'engines/**', 'games/**', 'tests/**') }}
          restore-keys: |
            ${{ runner.os }}-monobit-build-

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Boot smoke test
        # Nothing else in CI launches a game. Every other job compiles and
        # unit-tests, and no test links main.cpp -- so a static-init-order
        # fiasco, a missing required asset, or a shader that fails to compile
        # passes every gate and is found by whoever runs the exe next.
        # Needs a display and a GL driver: xvfb plus mesa's software renderer.
        run: |
          sudo apt-get install -y xvfb libgl1-mesa-dri
          # The runner has no GPU, so GL comes from mesa's software rasteriser.
          # llvmpipe reports 4.5, which covers the 3.3 core context the engine
          # asks for; without these it can fall through to a driver that cannot.
          export LIBGL_ALWAYS_SOFTWARE=1
          export GALLIUM_DRIVER=llvmpipe
          xvfb-run -a --server-args="-screen 0 1280x720x24"             bash games/selva-oscura/scripts/smoke_test.sh

  # -----------------------------------------------------------------------
  # LINT
  #
  #    Scope selection (PR only; push-to-master lints everything):
  #      - directly-changed .cpp files
  #      - for each directly-changed .h/.hpp, every .cpp in the same
  #        "src/" tree that mirrors the header's "include/" tree
  #          e.g. include/render/Texture.h -> src/render/*.cpp
  #          e.g. include/insight/Insight.h -> src/insight/*.cpp
  #    Conservative compared to the old `ninja -t deps` pass (lints
  #    sibling .cpp files even when they don't transitively include the
  #    changed header), but does not require the build to have run --
  #    which is what lets this job sit outside the `build` job.
  # -----------------------------------------------------------------------
  lint:
    name: Lint
    needs: standards
    runs-on: ubuntu-latest
    # No `needs: build`. Linting wants the compile database and the headers
    # dependencies generate, never object files -- and those headers cost
    # seconds, so this runs beside the build rather than behind it.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need history for the PR-base diff

      - name: Install dependencies
        run: |
          # Pin to clang-format/clang-tidy 18.1.x from the LLVM apt repo;
          # matches the local MSYS2 mingw64 toolchain.
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          echo "deb http://apt.llvm.org/$(lsb_release -cs)/ llvm-toolchain-$(lsb_release -cs)-18 main" \
            | sudo tee /etc/apt/sources.list.d/llvm.list
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build clang-18 clang-tidy-18 \
            libsdl2-dev libgl1-mesa-dev
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100
          sudo update-alternatives --install /usr/bin/clang-tidy clang-tidy /usr/bin/clang-tidy-18 100

      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-monobit-build-${{ hashFiles('cmake/**', 'CMakeLists.txt', 'engines/**', 'games/**', 'tests/**') }}
          restore-keys: |
            ${{ runner.os }}-monobit-build-

      - name: Configure
        run: |
          # Re-run configure unconditionally so compile_commands.json
          # reflects the current tree even on a cache hit. CMake is
          # incremental + fast (~5s) so this isn't a meaningful cost.
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Generate headers
        # Several dependencies write headers first-party code includes at
        # BUILD time, so configure alone leaves include paths that do not
        # resolve. The target names them; see cmake/FetchDependencies.cmake.
        run: cmake --build build --target generated-headers

      - name: Filter compile database
        # Analysis reads our translation units only. Dropping the rest is
        # what keeps this job independent of any dependency's build output.
        run: |
          mkdir -p build/analysis
          python3 scripts/filter_compile_db.py build/compile_commands.json \
            -o build/analysis/compile_commands.json

      - name: Find files to lint
        id: lint-files
        # A PR and the push that merges it apply the SAME rule -- lint what the
        # change touched -- differing only in which range names it. They used to
        # disagree: a PR linted its own diff while a push linted the whole tree,
        # so a violation in a file the PR never touched passed the merge gate and
        # broke master seconds later, with nothing in between that could catch
        # it. Whole-tree coverage still happens, nightly, where a half-hour job
        # belongs rather than in front of a merge.
        run: |
          RANGE=""
          case "${{ github.event_name }}" in
            pull_request)
              RANGE="origin/${{ github.base_ref }}...HEAD" ;;
            push)
              BEFORE="${{ github.event.before }}"
              # All-zeros on a first push, and unreachable after a force-push:
              # with no range to read, fall back to linting everything.
              if [ -n "$BEFORE" ] \
                 && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] \
                 && git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
                RANGE="${BEFORE}..${{ github.sha }}"
              fi ;;
          esac

          if [ -n "$RANGE" ]; then
            CHANGED=$(git diff --name-only --diff-filter=d "$RANGE" -- \
              'engines/' 'games/' \
              ':(exclude)engines/arduboy-legacy/**' \
              ':(exclude)games/rpg-arduboy/**')

            CHANGED_CPPS=$(echo "$CHANGED" | grep -E '\.cpp$' || true)
            CHANGED_HEADERS=$(echo "$CHANGED" | grep -E '\.h(pp)?$' || true)

            # Map each changed header to its mirrored src/ directory and
            # collect every .cpp in that directory.
            # include/render/Texture.h -> src/render/ -> src/render/*.cpp
            HEADER_AFFECTED=""
            for h in $CHANGED_HEADERS; do
              src_dir=$(echo "$h" | sed -E 's|/include/|/src/|; s|/[^/]+\.h(pp)?$||')
              if [ -d "$src_dir" ]; then
                affected=$(find "$src_dir" -maxdepth 1 -name '*.cpp')
                if [ -n "$affected" ]; then
                  HEADER_AFFECTED=$(printf '%s\n%s' "$HEADER_AFFECTED" "$affected")
                fi
              fi
            done

            FILES=$(printf "%s\n%s" "$CHANGED_CPPS" "$HEADER_AFFECTED" | \
              grep -E '\.cpp$' | grep -vE '^(build|_deps)/' | sort -u)
          else
            FILES=$(find engines games \
                \( -path engines/arduboy-legacy -o -path games/rpg-arduboy \) -prune \
              -o -name '*.cpp' -print)
          fi
          if [ -z "$FILES" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No .cpp files to lint."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "$FILES" > /tmp/lint-files.txt
            COUNT=$(echo "$FILES" | wc -l)
            echo "Linting $COUNT file(s):"
            cat /tmp/lint-files.txt
          fi

      - name: Drop third-party .clang-tidy configs
        if: steps.lint-files.outputs.skip != 'true'
        # Tracy ships its own .clang-tidy with `AnalyzeTemporaryDtors`,
        # an unknown key in clang-tidy 18+ that fails the run at config
        # parse time. Our HeaderFilterRegex excludes their headers
        # anyway; just remove their config so clang-tidy uses ours
        # everywhere.
        run: |
          find build/_deps -name '.clang-tidy' -delete 2>/dev/null || true

      - name: Run clang-tidy
        if: steps.lint-files.outputs.skip != 'true'
        run: |
          xargs -P $(nproc) \
            clang-tidy -p build/analysis \
              --header-filter='(engines/engine|games/[^/]+)/.*\.(h|hpp)$' \
              --warnings-as-errors='*' \
            < /tmp/lint-files.txt

  # -----------------------------------------------------------------------
  # STATIC ANALYSIS
  #    Reads the filtered compile database. Suppresses a small set of
  #    pedantic checks we don't want enforced.
  # -----------------------------------------------------------------------
  static-analysis:
    name: Static analysis
    needs: standards
    runs-on: ubuntu-latest
    # No `needs: build` -- analysis needs the compile database and the headers
    # dependencies generate, not object files. Building those alone is seconds,
    # so this runs beside `build` rather than behind it.
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            cppcheck \
            libsdl2-dev libgl1-mesa-dev

      - name: Restore build cache
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-monobit-build-${{ hashFiles('cmake/**', 'CMakeLists.txt', 'engines/**', 'games/**', 'tests/**') }}
          restore-keys: |
            ${{ runner.os }}-monobit-build-

      - name: Configure
        # Unconditionally, so the database describes the tree being analysed.
        # A cache restored from another commit carries that commit's database.
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug

      - name: Generate headers
        run: cmake --build build --target generated-headers

      - name: Filter compile database
        run: |
          mkdir -p build/analysis
          python3 scripts/filter_compile_db.py build/compile_commands.json \
            -o build/analysis/compile_commands.json

      - name: Run cppcheck
        run: |
          cppcheck --project=build/analysis/compile_commands.json \
            --enable=all \
            --inline-suppr \
            --suppress=missingInclude \
            --suppress=missingIncludeSystem \
            --suppress=unusedFunction \
            --suppress=useStlAlgorithm \
            --suppress=unmatchedSuppression \
            --suppress=normalCheckLevelMaxBranches \
            --suppress=checkersReport \
            --suppressions-list=cppcheck-suppressions.txt \
            --error-exitcode=1 \
            --quiet


  # -----------------------------------------------------------------------
  # TESTS UNDER SANITIZERS  (ASan + UBSan)
  #    Builds a Debug build with -fsanitize=address,undefined and runs the
  #    test suite. Catches use-after-free, double-free, buffer overflow,
  #    signed overflow, null deref, misaligned access, etc. — at the line
  #    of the bug, with a stack trace.
  #
  #    Uses a separate build directory (no cache key collision with the
  #    non-sanitized build job).
  # -----------------------------------------------------------------------
  sanitized-tests:
    name: Tests (sanitized)
    needs: standards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            clang \
            libsdl2-dev libgl1-mesa-dev

      - name: Cache sanitized build directory
        uses: actions/cache@v4
        with:
          path: build-san
          key: ${{ runner.os }}-monobit-build-san-${{ hashFiles('cmake/**', 'CMakeLists.txt', 'engines/**', 'games/**', 'tests/**') }}
          restore-keys: |
            ${{ runner.os }}-monobit-build-san-

      - name: Configure (sanitized)
        run: |
          cmake -S . -B build-san -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_SANITIZERS=ON

      - name: Build (sanitized)
        run: cmake --build build-san

      - name: Test (sanitized)
        env:
          # Halt at the first error and print a full stack trace; ASan
          # default would abort silently in some configs.
          ASAN_OPTIONS: halt_on_error=1:abort_on_error=1:print_stacktrace=1
          UBSAN_OPTIONS: halt_on_error=1:abort_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-san --output-on-failure
