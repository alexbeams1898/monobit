name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  # -----------------------------------------------------------------------
  # 1. FORMAT CHECK  (clang-format)
  #    Fails if any file differs from what clang-format would produce.
  #    Same as running Prettier --check in a JS project.
  # -----------------------------------------------------------------------
  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          # Skip archived subtrees -- they're imported from mono and held to that
          # repo's formatting rules. Treat as read-only reference; not extended.
          find engines games \
              \( -path engines/arduboy-legacy -o -path games/rpg-arduboy \) -prune \
            -o \( -name '*.cpp' -o -name '*.h' \) -print | \
          xargs clang-format --dry-run --Werror

  # -----------------------------------------------------------------------
  # 2. BUILD + LINT  (clang-tidy runs during the build via CMake)
  #    Also compiles everything — catches compiler errors on every PR.
  # -----------------------------------------------------------------------
  build:
    name: Build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            clang clang-tidy \
            libsdl2-dev libgl1-mesa-dev

      # Cache the full build directory — preserves SDL2's configure results,
      # compiled dep artifacts, and our own object files.
      # Key covers all CMake and source files; any change busts only the
      # affected objects (restore-keys falls back to nearest prior cache).
      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-build-${{ hashFiles('cmake/**', 'CMakeLists.txt', 'engines/**', 'games/**', 'tests/**') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build

      - name: Find files to lint
        id: lint-files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # Diff against base, excluding archived subtrees (kept as read-only
            # reference; mono's formatting rules differ from monobit's).
            CHANGED=$(git diff --name-only --diff-filter=d \
              origin/${{ github.base_ref }}...HEAD -- \
              'engines/' 'games/' \
              ':(exclude)engines/arduboy-legacy/**' \
              ':(exclude)games/rpg-arduboy/**')

            # Directly changed .cpp files
            CHANGED_CPPS=$(echo "$CHANGED" | grep -E '\.cpp$' || true)

            # Changed headers -- use ninja deps to find affected .cpp files
            CHANGED_HEADERS=$(echo "$CHANGED" | grep -E '\.h(pp)?$' || true)
            HEADER_AFFECTED=""

            if [ -n "$CHANGED_HEADERS" ]; then
              echo "$CHANGED_HEADERS" | xargs -n1 basename > /tmp/changed-headers.txt
              echo "Changed headers:"
              cat /tmp/changed-headers.txt

              # Parse ninja dependency graph: for each build target, check if
              # any of its transitive deps match a changed header basename.
              # If so, record the target's source .cpp file.
              ninja -C build -t deps 2>/dev/null | awk '
                BEGIN { while ((getline h < "/tmp/changed-headers.txt") > 0) wanted[h]=1 }
                /\.o(bj)?: #deps/ { src="" }
                /^    / {
                  dep=$0; gsub(/^ +/,"",dep)
                  if (src=="" && dep ~ /\.cpp$/) src=dep
                  n=split(dep,parts,"/")
                  if (parts[n] in wanted) affected[src]=1
                }
                END { for(f in affected) if(f!="") print f }
              ' > /tmp/header-affected.txt

              # ninja deps uses absolute paths -- strip repo root prefix
              REPO_ROOT="${{ github.workspace }}/"
              sed -i "s|${REPO_ROOT}||g" /tmp/header-affected.txt

              HEADER_AFFECTED=$(cat /tmp/header-affected.txt)
            fi

            # Union changed .cpp files + header-affected .cpp files
            FILES=$(printf "%s\n%s" "$CHANGED_CPPS" "$HEADER_AFFECTED" | \
              grep -E '\.cpp$' | sort -u)
          else
            # Push to master: lint everything except archived subtrees.
            FILES=$(find engines games \
                \( -path engines/arduboy-legacy -o -path games/rpg-arduboy \) -prune \
              -o -name '*.cpp' -print)
          fi
          if [ -z "$FILES" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No .cpp files to lint."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "$FILES" > /tmp/lint-files.txt
            COUNT=$(echo "$FILES" | wc -l)
            echo "Linting $COUNT file(s):"
            cat /tmp/lint-files.txt
          fi

      - name: Lint (clang-tidy)
        if: steps.lint-files.outputs.skip != 'true'
        run: |
          xargs -P $(nproc) \
            clang-tidy -p build \
              --header-filter='(engines/engine|games/[^/]+)/.*\.(h|hpp)$' \
              --warnings-as-errors='*' \
            < /tmp/lint-files.txt

      - name: Test
        run: ctest --test-dir build --output-on-failure
