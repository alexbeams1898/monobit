name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  # -----------------------------------------------------------------------
  # 1. FORMAT CHECK  (clang-format)
  #    Fails if any file differs from what clang-format would produce.
  #    Same as running Prettier --check in a JS project.
  # -----------------------------------------------------------------------
  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          find engine game -name '*.cpp' -o -name '*.h' | \
          xargs clang-format --dry-run --Werror

  # -----------------------------------------------------------------------
  # 2. BUILD + LINT  (clang-tidy runs during the build via CMake)
  #    Also compiles everything — catches compiler errors on every PR.
  # -----------------------------------------------------------------------
  build:
    name: Build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            clang clang-tidy \
            libsdl2-dev libgl1-mesa-dev

      # Cache FetchContent source dirs keyed on FetchDependencies.cmake.
      # On a cache hit CMake sees the sources already present and skips the
      # git clones — cuts configure time from ~10 min to ~30 s.
      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: ${{ runner.os }}-deps-${{ hashFiles('cmake/FetchDependencies.cmake') }}
          restore-keys: |
            ${{ runner.os }}-deps-

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build

      - name: Lint (clang-tidy)
        run: |
          find engine game -name '*.cpp' | xargs \
            clang-tidy -p build --warnings-as-errors='*'

      - name: Test
        run: ctest --test-dir build --output-on-failure
