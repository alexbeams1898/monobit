name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  # -----------------------------------------------------------------------
  # 1. FORMAT CHECK  (clang-format)
  #    Fails if any file differs from what clang-format would produce.
  #    Same as running Prettier --check in a JS project.
  # -----------------------------------------------------------------------
  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format
        run: sudo apt-get install -y clang-format

      - name: Check formatting
        run: |
          find engine game -name '*.cpp' -o -name '*.h' | \
          xargs clang-format --dry-run --Werror

  # -----------------------------------------------------------------------
  # 2. BUILD + LINT  (clang-tidy runs during the build via CMake)
  #    Also compiles everything — catches compiler errors on every PR.
  # -----------------------------------------------------------------------
  build:
    name: Build and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build \
            clang clang-tidy \
            libsdl2-dev libgl1-mesa-dev

      # Cache the full build directory — preserves SDL2's configure results,
      # compiled dep artifacts, and our own object files.
      # Key covers all CMake and source files; any change busts only the
      # affected objects (restore-keys falls back to nearest prior cache).
      - name: Cache build directory
        uses: actions/cache@v4
        with:
          path: build
          key: ${{ runner.os }}-build-${{ hashFiles('cmake/**', 'CMakeLists.txt', 'engine/**', 'game/**', 'tests/**') }}
          restore-keys: |
            ${{ runner.os }}-build-

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build

      - name: Find files to lint
        id: lint-files
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            # PR: lint .cpp files that changed, plus if any .h changed,
            # lint all .cpp files (header changes can ripple everywhere).
            CHANGED=$(git diff --name-only --diff-filter=d \
              origin/${{ github.base_ref }}...HEAD -- 'engine/' 'game/')
            HEADERS=$(echo "$CHANGED" | grep -E '\.h(pp)?$' || true)
            if [ -n "$HEADERS" ]; then
              # Header changed -- lint everything to catch ripple effects.
              FILES=$(find engine game -name '*.cpp')
            else
              FILES=$(echo "$CHANGED" | grep -E '\.cpp$' || true)
            fi
          else
            # Push to master: lint everything.
            FILES=$(find engine game -name '*.cpp')
          fi
          if [ -z "$FILES" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "No .cpp files to lint."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "$FILES" > /tmp/lint-files.txt
            echo "Linting $(echo "$FILES" | wc -l) file(s)"
          fi

      - name: Lint (clang-tidy)
        if: steps.lint-files.outputs.skip != 'true'
        run: |
          xargs -P $(nproc) \
            clang-tidy -p build \
              --header-filter='(engine|game)/.*\.(h|hpp)$' \
              --warnings-as-errors='*' \
            < /tmp/lint-files.txt

      - name: Test
        run: ctest --test-dir build --output-on-failure
