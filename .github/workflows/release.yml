name: release

# Triggered by every push to master. For each merged PR:
#   1. Pull the PR body, prepend its `## Changelog` bullets to CHANGELOG.md
#      under [Unreleased].
#   2. If the branch prefix is patch/minor/major, bump the version in
#      CMakeLists.txt, promote [Unreleased] to [X.Y.Z] - DATE, commit + tag,
#      then build the game and publish releases to both repos using the
#      [X.Y.Z] section as the release notes.
#   3. If the branch prefix is chore/docs, only the changelog prepend commit
#      is made -- no version bump, no build, no release.

on:
  push:
    branches: [master]
    paths-ignore:
      - 'CMakeLists.txt'  # bot's own version bump commit -- don't self-retrigger
      - 'CHANGELOG.md'    # bot's own changelog commit -- don't self-retrigger
  workflow_dispatch:

permissions:
  contents: write        # push the version bump commit, tag, and release
  pull-requests: read    # gh pr view to read the source branch name + body

jobs:
  # -----------------------------------------------------------------------
  # 1. PREPEND CHANGELOG + (CONDITIONALLY) BUMP VERSION
  #    Reads the merged PR's body, prepends its Changelog bullets to
  #    CHANGELOG.md [Unreleased]. If the branch prefix triggers a release,
  #    also bumps CMakeLists.txt and promotes [Unreleased] to [X.Y.Z]. All
  #    edits are committed in a single bot commit and tagged.
  # -----------------------------------------------------------------------
  bump:
    name: Changelog + version bump
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
      should_release: ${{ steps.bump.outputs.should_release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine bump from merged PR branch prefix
        id: bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          # Squash-merge commits end in " (#NNN)" -- extract PR number.
          pr_num=$(git log -1 --pretty=%s | grep -oP '\(#\K\d+' || echo "")
          if [ -z "$pr_num" ]; then
            echo "No PR number in commit -- not a squash-merge. Skipping."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
            echo "pr_num=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pr_num=$pr_num" >> "$GITHUB_OUTPUT"
          branch=$(gh pr view "$pr_num" --json headRefName -q .headRefName)
          prefix="${branch%%/*}"
          case "$prefix" in
            patch) bump=patch ;;
            minor) bump=minor ;;
            major) bump=major ;;
            chore|docs)
              echo "Prefix '$prefix' -- changelog only, no version bump."
              echo "should_release=false" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            *)
              echo "::error::Branch '$branch' has unrecognized prefix '$prefix'. Expected patch/, minor/, major/, chore/, or docs/."
              exit 1
              ;;
          esac
          cur=$(grep -oP 'project\([^)]*VERSION\s+\K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
          if [ -z "$cur" ]; then
            echo "::error::Could not extract version from CMakeLists.txt"
            exit 1
          fi
          IFS='.' read -r maj min pat <<< "$cur"
          case "$bump" in
            patch) pat=$((pat+1)) ;;
            minor) min=$((min+1)); pat=0 ;;
            major) maj=$((maj+1)); min=0; pat=0 ;;
          esac
          new="$maj.$min.$pat"
          echo "Bumping $cur -> $new ($bump)"
          sed -i "s/VERSION $cur /VERSION $new /" CMakeLists.txt
          if ! grep -q "VERSION $new " CMakeLists.txt; then
            echo "::error::sed failed to update CMakeLists.txt from $cur to $new"
            exit 1
          fi
          echo "version=$new" >> "$GITHUB_OUTPUT"
          echo "should_release=true" >> "$GITHUB_OUTPUT"

      - name: Prepend PR changelog into [Unreleased]
        if: steps.bump.outputs.pr_num != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUM: ${{ steps.bump.outputs.pr_num }}
        run: |
          set -e
          gh pr view "$PR_NUM" --json body -q .body > /tmp/pr_body.md
          python3 game/scripts/changelog.py prepend /tmp/pr_body.md

      - name: Promote [Unreleased] to released version
        if: steps.bump.outputs.should_release == 'true'
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -e
          python3 game/scripts/changelog.py release "$VERSION"

      - name: Commit, tag, push
        if: steps.bump.outputs.pr_num != ''
        env:
          SHOULD_RELEASE: ${{ steps.bump.outputs.should_release }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Stage whatever changed (CHANGELOG.md always, CMakeLists.txt only on release).
          git add CHANGELOG.md
          if [ "$SHOULD_RELEASE" = "true" ]; then
            git add CMakeLists.txt
          fi

          # If nothing actually changed (e.g. PR body was `skip` and not a release),
          # exit cleanly without an empty commit.
          if git diff --cached --quiet; then
            echo "No changelog or version changes to commit."
            exit 0
          fi

          if [ "$SHOULD_RELEASE" = "true" ]; then
            git commit -m "Release v$VERSION"
            git tag "v$VERSION"
            git push
            git push --tags
          else
            git commit -m "Update CHANGELOG.md"
            git push
          fi

  # -----------------------------------------------------------------------
  # 2. BUILD AND RELEASE
  #    Windows runner with MSYS2 MinGW64 -- matches local dev environment
  #    exactly so package.sh (ldd + /c/windows/ filter) works unmodified.
  #    Release notes come from CHANGELOG.md via changelog.py notes <version>.
  # -----------------------------------------------------------------------
  release:
    name: Build and release
    needs: bump
    if: needs.bump.outputs.should_release == 'true'
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master  # post-bump commit
          fetch-depth: 0

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-SDL2
            mingw-w64-x86_64-github-cli
            python
            zip
            git

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Package
        run: ./game/scripts/package.sh

      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.bump.outputs.version }}
        run: |
          python3 game/scripts/changelog.py notes "$VERSION" > /tmp/release_notes.md
          cat /tmp/release_notes.md

      - name: Create GitHub Release on source repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.bump.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            "prison-escape-game-v$VERSION.zip" \
            --title "v$VERSION" \
            --notes-file /tmp/release_notes.md

      - name: Mirror release to public repo
        env:
          GH_TOKEN: ${{ secrets.PUBLIC_REPO_TOKEN }}
          VERSION: ${{ needs.bump.outputs.version }}
        run: |
          gh release create "v$VERSION" \
            "prison-escape-game-v$VERSION.zip" \
            --repo alexbeams1898/prison-escape-game-releases \
            --title "v$VERSION" \
            --notes-file /tmp/release_notes.md
