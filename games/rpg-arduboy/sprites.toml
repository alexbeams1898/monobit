# ---------------------------------------------------------------------------
# Fallen halo — the sigil shown during scene-paging cover transitions.
# Drawn into the framebuffer after the dither lands on a fully-obscured
# frame; held through the SPM swap; replaced by the destination's first
# real draw. Lore: a halo broken inside-out, the Pilgrim being processed
# by Hell. See docs/lore.md "Fallen Halo".
#
# Seed entry: source PNG is the design-board reference (art/fallenhalo.png)
# but bytes don't matter — every frame is hand-traced via
# `spritebake animate fallen_halo_data --trace art/fallenhalo.png`.
# The bbox just needs to be a valid rect over the source so the seed
# pipeline succeeds; fixed at the top-left animation cell as a stable
# reference.
[[sprites]]
ident = "fallen_halo_data"
source = "art/fallenhalo.png"
width = 128
height = 64
pipeline = "fallen_halo_seed"
bbox = { x0 = 80, y0 = 540, x1 = 240, y1 = 700 }
fade_bottom = false

# Animation frames — 16 cells of 128×64 in a horizontal strip, saved by
# the `animate` command to art/animations/fallen_halo_data/idle.png.
# Strip dimensions: 2048×64. f0 = the sigil at full strength (the dither's
# target during phase 2 of the cover); f1..f15 = the post-SPM "exit"
# animation where the sigil collapses into nothing as the destination
# scene takes over. Played at 12 fps after the post-SPM hold.
[[sprites]]
