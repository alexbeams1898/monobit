# spritebake manifest for games/rpg
#
# Run:    python -m tools.spritebake -m games/rpg/sprites.toml bake
# Preview: python -m tools.spritebake -m games/rpg/sprites.toml preview --open
#
# The baker rewrites the matching `const u8 NAME_data[N] PROGMEM = { ... };`
# blocks in [output].cpp. Every sprite listed below must already have a
# corresponding declaration in that file — the baker never creates new
# declarations, only replaces existing ones. This keeps surrounding
# comments, include order, and manually-tuned sprites intact.

[output]
cpp = "games/rpg/sprites.cpp"
layout = "col-major-topbit0"
progmem = true


# ------------------------------------------------------------------ pipelines
#
# default_boss    — 16x16 boss render; Gaussian blur + Otsu + close holes +
#                   vert-boost. Tuned on bosses.png 2026-04-21.
#
# default_lucifer — 20x24 render for Lucifer with slightly more aggressive
#                   feature preservation. Source is a standalone PNG.
#
# Pipelines use "$width" / "$height" placeholders where appropriate so the
# same pipeline can drive sprites of different sizes.

[pipelines.default_boss]
stages = [
  "autocrop",
  { gaussian_blur = { radius_ratio = 0.5 } },
  { aspect_fit = { width = "$width", height = "$height" } },
  { downscale = { width = "$width", height = "$height", method = "lanczos" } },
  "threshold_otsu",
  "morph_close_holes",
  "vert_feature_boost",
]

[pipelines.default_lucifer]
stages = [
  "autocrop",
  { gaussian_blur = { radius_ratio = 0.5 } },
  { aspect_fit = { width = "$width", height = "$height" } },
  { downscale = { width = "$width", height = "$height", method = "lanczos" } },
  "threshold_otsu",
  "morph_close_holes",
  { vert_feature_boost = { band_ratio = 0.4, min_run = 2 } },
]

# --- experimental pipelines for iteration ---

# Dither-based: preserves mid-gray horn/spike pixels that global threshold loses.
[pipelines.dither_fs]
stages = [
  "autocrop",
  { aspect_fit = { width = "$width", height = "$height" } },
  { downscale = { width = "$width", height = "$height", method = "lanczos" } },
  { floyd_steinberg = { threshold = 128 } },
]

# Dither with pre-blur to smooth source texture.
[pipelines.dither_fs_blurred]
stages = [
  "autocrop",
  { gaussian_blur = { radius_ratio = 0.3 } },
  { aspect_fit = { width = "$width", height = "$height" } },
  { downscale = { width = "$width", height = "$height", method = "lanczos" } },
  { floyd_steinberg = { threshold = 128 } },
  "morph_close_holes",
]

# Edge-preserving dither: solid edges, dithered interior. Best-of-both.
[pipelines.dither_edge_preserve]
stages = [
  "autocrop",
  { gaussian_blur = { radius_ratio = 0.3 } },
  { aspect_fit = { width = "$width", height = "$height" } },
  { downscale = { width = "$width", height = "$height", method = "lanczos" } },
  "sobel_edges",
  { edge_preserving_dither = { edge_threshold = 60, interior_threshold = 140 } },
  "morph_close_holes",
]

# Feature-aware: detect thin vertical features in the source, preserve them
# after downscaling. Purpose-built for horns, spikes, tails.
[pipelines.feature_aware]
stages = [
  "autocrop",
  { detect_thin_features = { max_width = 40, min_length = 30, band_ratio = 0.25 } },
  { gaussian_blur = { radius_ratio = 0.5 } },
  { aspect_fit = { width = "$width", height = "$height" } },
  { downscale = { width = "$width", height = "$height", method = "lanczos" } },
  "threshold_otsu",
  "morph_close_holes",
  "reinforce_thin_features",
]

# Silhouette outline + fill — flattens interior to solid shape.
[pipelines.silhouette]
stages = [
  "autocrop",
  { gaussian_blur = { radius_ratio = 0.4 } },
  { aspect_fit = { width = "$width", height = "$height" } },
  { downscale = { width = "$width", height = "$height", method = "lanczos" } },
  { outline_and_fill = { silhouette_threshold = 80, fill = true } },
  "morph_close_holes",
]

# Root-cause horn preservation: detects spike peaks in the SOURCE's
# top-edge profile (peak detection on the silhouette's upper boundary),
# remembers them in normalized coords, and re-lights them in the target
# after downscaling. Works for any sprite with distinct upper spikes —
# horns, spears, crowns, raised tails. Parameters are ratios, not
# hardcoded pixel counts.
[pipelines.peak_features]
stages = [
  "autocrop",
  { detect_thin_features = { max_width_ratio = 0.15, min_length_ratio = 0.02, band_ratio = 0.02, min_prominence = 0.03, peak_separation_ratio = 0.05 } },
  { gaussian_blur = { radius_ratio = 0.4 } },
  { aspect_fit = { width = "$width", height = "$height" } },
  { downscale = { width = "$width", height = "$height", method = "lanczos" } },
  "threshold_otsu",
  "morph_close_holes",
  { reinforce_thin_features = { min_target_length = 2, min_target_width = 1 } },
]

# Full feature-aware pipeline for devil-type sprites:
#   - detect horns (peaks in top profile)
#   - detect claws (peaks in bottom profile)
#   - detect eyes (dark spots in upper body area)
#   - downscale body
#   - threshold + clean
#   - reinforce all three feature sets
# This is what "structure-preserving downscale" actually looks like.
[pipelines.devil]
stages = [
  "autocrop",
  { detect_thin_features = { max_width_ratio = 0.15, min_length_ratio = 0.02, band_ratio = 0.02, min_prominence = 0.03, peak_separation_ratio = 0.05, attach_as = "horns" } },
  { detect_bottom_features = { max_width_ratio = 0.15, min_length_ratio = 0.02, band_ratio = 0.12, min_prominence = 0.02, peak_separation_ratio = 0.03, attach_as = "claws" } },
  { detect_dark_spots = { min_size_ratio = 0.0005, max_size_ratio = 0.008, max_brightness = 50, y_min_ratio = 0.08, y_max_ratio = 0.25, attach_as = "eyes" } },
  { gaussian_blur = { radius_ratio = 0.3 } },
  { aspect_fit = { width = "$width", height = "$height" } },
  { downscale = { width = "$width", height = "$height", method = "lanczos" } },
  "sobel_edges",
  { edge_preserving_dither = { edge_threshold = 55, interior_threshold = 135 } },
  "morph_close_holes",
  { reinforce_thin_features = { feature_key = "horns", min_target_length = 2, min_target_width = 1 } },
  { reinforce_thin_features = { feature_key = "claws", min_target_length = 1, min_target_width = 1 } },
  { reinforce_dark_spots = { feature_key = "eyes", min_target_radius = 0 } },
]

# Peak-detected horns + edge-preserving dither body — combines the two best
# techniques from our iteration. Horns come from source peak detection,
# body comes from edge-preserving dither.
[pipelines.peaks_plus_body]
stages = [
  "autocrop",
  { detect_thin_features = { max_width_ratio = 0.15, min_length_ratio = 0.02, band_ratio = 0.02, min_prominence = 0.03, peak_separation_ratio = 0.05 } },
  { gaussian_blur = { radius_ratio = 0.3 } },
  { aspect_fit = { width = "$width", height = "$height" } },
  { downscale = { width = "$width", height = "$height", method = "lanczos" } },
  "sobel_edges",
  { edge_preserving_dither = { edge_threshold = 55, interior_threshold = 135 } },
  "morph_close_holes",
  { reinforce_thin_features = { min_target_length = 2, min_target_width = 1 } },
]

# Purpose-built for sprites with horns or spikes. Stacks every
# horn-preserving technique we have. Aggressive edge threshold keeps
# horns solid; majority_smooth denoises the dither without eating edges.
[pipelines.horns_preserved]
stages = [
  "autocrop",
  { gaussian_blur = { radius_ratio = 0.3 } },
  { aspect_fit = { width = "$width", height = "$height" } },
  { downscale = { width = "$width", height = "$height", method = "lanczos" } },
  "sobel_edges",
  { edge_preserving_dither = { edge_threshold = 40, interior_threshold = 130 } },
  "morph_close_holes",
  { majority_smooth = { threshold = 4, iterations = 1 } },
  { vert_feature_boost = { band_ratio = 0.35, min_run = 2 } },
]

# Horn-preserved + outline-sharp: add outline extraction on top
[pipelines.horns_outline]
stages = [
  "autocrop",
  { gaussian_blur = { radius_ratio = 0.3 } },
  { aspect_fit = { width = "$width", height = "$height" } },
  { downscale = { width = "$width", height = "$height", method = "lanczos" } },
  "sobel_edges",
  { edge_preserving_dither = { edge_threshold = 40, interior_threshold = 130 } },
  { silhouette_preserve = { source_edge_threshold = 60, protect_radius = 1 } },
  "morph_close_holes",
  { vert_feature_boost = { band_ratio = 0.35, min_run = 2 } },
]

# Distance-weighted threshold: edge pixels lit more aggressively than interior.
[pipelines.distance_weighted]
stages = [
  "autocrop",
  { gaussian_blur = { radius_ratio = 0.4 } },
  { aspect_fit = { width = "$width", height = "$height" } },
  { downscale = { width = "$width", height = "$height", method = "lanczos" } },
  "sobel_edges",
  { threshold_distance_weighted = { base = 110, interior_weight = 0.3 } },
  "morph_close_holes",
]

# Portrait-bust pipeline — Bayer-masked tonal dither.
#
# The loader has already sliced the cell and applied portrait_ratio. Here:
#   blur → aspect_fit → downscale → stash silhouette mask → Bayer dither
#   → AND with silhouette (kills the background dot-grid) → reinforce horns
#   + eyes if they were detected earlier.
#
# Bottom fade is NOT in the pipeline — it's a per-sprite post-stage, driven
# by `fade_bottom` on each sprite row. Defaults on; turn off for figures
# that end in a real hard edge (Charon's scythe shaft, Phlegyas's flames).
[pipelines.boss_portrait]
stages = [
  "autocrop",
  { detect_thin_features = { max_width_ratio = 0.15, min_length_ratio = 0.02, band_ratio = 0.04, min_prominence = 0.03, peak_separation_ratio = 0.05, attach_as = "horns", require_symmetric_pair = true, symmetry_tolerance = 0.20 } },
  { detect_dark_spots = { min_size_ratio = 0.0015, max_size_ratio = 0.010, max_brightness = 60, y_min_ratio = 0.10, y_max_ratio = 0.35, attach_as = "eyes" } },
  { gaussian_blur = { radius_ratio = 0.3 } },
  { aspect_fit = { width = "$width", height = "$height" } },
  { downscale = { width = "$width", height = "$height", method = "lanczos" } },
  { stash_silhouette_from_gray = { threshold = 96, close_iterations = 1 } },
  { bayer_ordered_dither = { matrix = 4, threshold = 128 } },
  "apply_stashed_silhouette",
  { reinforce_thin_features = { feature_key = "horns", min_target_length = 2, max_target_length = 3, min_target_width = 2 } },
  { reinforce_dark_spots = { feature_key = "eyes", min_target_radius = 0 } },
]

# Same recipe, no horn detection — for bosses whose top silhouette is a
# crown, crest, or tangle of serpents rather than a pair of horns.
[pipelines.boss_portrait_nohorns]
stages = [
  "autocrop",
  { detect_dark_spots = { min_size_ratio = 0.0015, max_size_ratio = 0.010, max_brightness = 60, y_min_ratio = 0.10, y_max_ratio = 0.35, attach_as = "eyes" } },
  { gaussian_blur = { radius_ratio = 0.3 } },
  { aspect_fit = { width = "$width", height = "$height" } },
  { downscale = { width = "$width", height = "$height", method = "lanczos" } },
  { stash_silhouette_from_gray = { threshold = 96, close_iterations = 1 } },
  { bayer_ordered_dither = { matrix = 4, threshold = 128 } },
  "apply_stashed_silhouette",
  { reinforce_dark_spots = { feature_key = "eyes", min_target_radius = 0 } },
]

# Threshold-only boss portrait — same approach that won for the player
# classes: line-art preservation via a hard gray threshold, no dither,
# no silhouette-fill, no feature reinforcement. The source art is
# already drawn as 1-bit pixel art with the right hollows / horn
# shapes / eye sockets — running detect_thin_features and
# detect_dark_spots over-amplified those features into chunky artifacts
# (Lucifer's antennae horns turning into floating blobs, Cerberus's
# eye getting re-erased). The threshold preserves the source detail
# directly.
[pipelines.boss_portrait_clean]
stages = [
  "autocrop",
  { pad = { top = 8, bottom = 4, left = 4, right = 4 } },
  { gaussian_blur = { radius_ratio = 0.3 } },
  { aspect_fit = { width = "$width", height = "$height" } },
  { downscale = { width = "$width", height = "$height", method = "lanczos" } },
  { threshold_fixed = { value = 96 } },
  { morph_open_speckle = { min_neighbors = 1 } },
]


# -------------------------------------------------------------------- sprites
#
# Each sprite corresponds to a declaration in sprites.cpp. `ident` is the
# C variable name; `source` is the art file (relative to repo root);
# `width` / `height` are the target 1-bit dimensions.
#
# For sprites sliced out of a spritesheet, include a [sprites.slice] table:
#   cols / rows define the grid; `index` picks the cell row-major
#   (0 = top-left); trim_*_ratio chops the given fraction off each side
#   of the cell (useful for cells with label text above the figure).

[[sprites]]
ident = "boss_charon_data"
source = "art/bosses.png"
width = 36
height = 48
pipeline = "boss_portrait_clean"
slice = { cols = 4, rows = 2, index = 0, autocrop_to_figure = true }
fade_bottom = false  # ends at the scythe shaft — no dissolve.

